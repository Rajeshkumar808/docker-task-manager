
name: Docker Task Manager CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Build Backend Image
        run: docker build -t taskmanager-backend ./backend

      - name: Build Frontend Image
        run: docker build -t taskmanager-frontend ./frontend

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
       username: ${{ secrets.DOCKERHUB_USERNAME }}
password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Backend Image
        if: github.event_name == 'push'
        run: |
          docker tag taskmanager-backend ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-backend:latest

      - name: Push Frontend Image
        if: github.event_name == 'push'
        run: |
          docker tag taskmanager-frontend ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-frontend:latest

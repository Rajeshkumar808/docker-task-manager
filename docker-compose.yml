
services:
  frontend:
    build: ./frontend
    container_name: taskmanager-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: taskmanager-backend
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/taskmanager
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:5000"
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: taskmanager-mongodb
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mongodb_data:
